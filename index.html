<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator3000</title>
</head>
<body>
    <div id="visor">0</div>
    <div button data-num="1">1</div>
    <div button data-num="2">2</div>
    <div button data-num="3">3</div>
    <div button data-num="4">4</div>
    <div button data-num="5">5</div>
    <div button data-num="6">6</div>
    <div button data-num="7">7</div>
    <div button data-num="8">8</div>
    <div button data-num="9">9</div>
    <div button data-num="0">0</div>
    <div button data-op="adição">+</div>
    <div button data-op="subtração">-</div>
    <div button data-op="multiplicação">X</div>
    <div button data-op="divisão">/</div>
    <div button data-op="igual">=</div>
    <div button data-op="limpar">C</div>
</body>
</html>
